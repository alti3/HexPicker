<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hex Picker with Zones</title>

  <!-- Tailwind CSS v4 browser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>

  <!-- Font Awesome CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Leaflet Draw CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />

</head>

<body class="relative m-0 h-full w-full overflow-hidden font-sans">
  <div id="map" class="h-full w-full"></div>

  <!-- ------------- Side Card ------------- -->
  <aside class="absolute top-3 right-3 z-[1000] flex h-[calc(100%-1.5rem)] w-96 flex-col gap-3 overflow-y-auto overscroll-contain rounded-[10px] border border-[#d9dde3] bg-white px-5 py-4 shadow-[0_8px_28px_rgba(0,0,0,0.14)]">
    <header class="flex flex-none items-start justify-between gap-4 border-b border-[#e4e7ec] pb-3">
      <div>
        <h1 class="text-lg font-semibold leading-6 text-[#1f2937]">Hex Picker</h1>
        <p class="mt-0.5 text-xs text-[#667085]">Build and manage map zones.</p>
      </div>
      <div id="hexagonCounter" class="flex-none rounded-full bg-[#eef4ff] px-3 py-1.5 text-xs font-semibold text-[#175cd3]" aria-live="polite">Selected Hexagons: 0</div>
    </header>

    <section class="flex-none rounded-lg border border-[#dfe3e8] bg-[#fafbfc] p-3" aria-labelledby="selectionHeading">
      <div class="mb-2.5 flex items-center justify-between gap-3">
        <h2 id="selectionHeading" class="text-sm font-semibold text-[#344054]">Selection</h2>
        <label for="resolutionSelect" class="text-xs font-medium text-[#667085]">Grid resolution</label>
      </div>
      <select id="resolutionSelect" class="mb-2.5 w-full cursor-pointer rounded-md border border-[#cfd4dc] bg-white px-3 py-2 text-sm text-[#344054] outline-none focus:border-[#84adff] focus:ring-2 focus:ring-[#2e90fa]/20 disabled:cursor-not-allowed disabled:bg-[#f2f4f7]"></select>
      <div class="grid grid-cols-2 gap-2">
        <button id="drawButton" class="inline-flex min-h-9 cursor-pointer items-center justify-center gap-2 rounded-md border border-[#175cd3] bg-[#175cd3] px-3 py-2 text-xs font-semibold text-white transition-colors enabled:hover:bg-[#1849a9] disabled:cursor-not-allowed disabled:border-[#d0d5dd] disabled:bg-[#e4e7ec] disabled:text-[#98a2b3]">
          <i class="fas fa-draw-polygon" aria-hidden="true"></i> Draw polygon
        </button>
        <button id="createZoneButton" class="inline-flex min-h-9 cursor-pointer items-center justify-center gap-2 rounded-md border border-[#27844b] bg-[#27844b] px-3 py-2 text-xs font-semibold text-white transition-colors enabled:hover:bg-[#216e3f] disabled:cursor-not-allowed disabled:border-[#d0d5dd] disabled:bg-[#e4e7ec] disabled:text-[#98a2b3]" disabled>
          <i class="fas fa-plus" aria-hidden="true"></i> Create zone
        </button>
        <button id="clearButton" class="inline-flex min-h-9 cursor-pointer items-center justify-center gap-2 rounded-md border border-[#d0d5dd] bg-white px-3 py-2 text-xs font-semibold text-[#475467] transition-colors enabled:hover:bg-[#f2f4f7] disabled:cursor-not-allowed disabled:bg-[#f2f4f7] disabled:text-[#98a2b3]" disabled>
          <i class="fas fa-eraser" aria-hidden="true"></i> Clear selection
        </button>
        <button id="finishEditButton" class="hidden min-h-9 cursor-pointer items-center justify-center gap-2 rounded-md border border-[#d4a106] bg-[#ffc107] px-3 py-2 text-xs font-semibold text-[#332701] transition-colors enabled:hover:bg-[#e0a800] disabled:cursor-not-allowed disabled:opacity-50">
          <i class="fas fa-check" aria-hidden="true"></i> Finish editing
        </button>
      </div>
    </section>

    <section class="flex-none rounded-lg border border-[#dfe3e8] bg-white p-3" aria-labelledby="zoneDataHeading">
      <h2 id="zoneDataHeading" class="mb-2.5 text-sm font-semibold text-[#344054]">All-zone data</h2>
      <div class="grid grid-cols-2 gap-2">
        <button id="copyIdsButton" class="inline-flex min-h-9 cursor-pointer items-center justify-center gap-2 rounded-md border border-[#b8d7fb] bg-[#eff6ff] px-3 py-2 text-xs font-semibold text-[#175cd3] transition-colors enabled:hover:bg-[#dbeafe] disabled:cursor-not-allowed disabled:opacity-50" disabled>
          <i class="fas fa-hashtag" aria-hidden="true"></i> Copy cell IDs
        </button>
        <button id="copyGeoButton" class="inline-flex min-h-9 cursor-pointer items-center justify-center gap-2 rounded-md border border-[#b7dfc2] bg-[#effaf2] px-3 py-2 text-xs font-semibold text-[#19733a] transition-colors enabled:hover:bg-[#dcf4e3] disabled:cursor-not-allowed disabled:opacity-50" disabled>
          <i class="fas fa-copy" aria-hidden="true"></i> Copy GeoJSON
        </button>
        <button id="exportGeoButton" class="inline-flex min-h-9 cursor-pointer items-center justify-center gap-2 rounded-md border border-[#d7c8ef] bg-[#f5f0fc] px-3 py-2 text-xs font-semibold text-[#6941a5] transition-colors enabled:hover:bg-[#ebe1f8] disabled:cursor-not-allowed disabled:opacity-50" disabled>
          <i class="fas fa-download" aria-hidden="true"></i> Export file
        </button>
        <button id="importGeoButton" class="inline-flex min-h-9 cursor-pointer items-center justify-center gap-2 rounded-md border border-[#d0d5dd] bg-white px-3 py-2 text-xs font-semibold text-[#475467] transition-colors enabled:hover:bg-[#f2f4f7] disabled:cursor-not-allowed disabled:bg-[#f2f4f7] disabled:text-[#98a2b3]">
          <i class="fas fa-upload" aria-hidden="true"></i> Import file
        </button>
      </div>
    </section>
    <input type="file" id="geojsonFile" class="hidden" accept=".geojson,.json">
    <section class="flex flex-none flex-col gap-2" aria-labelledby="zonesHeading">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h2 id="zonesHeading" class="text-base font-semibold text-[#1f2937]">Zones</h2>
          <p class="mt-0.5 text-xs text-[#667085]">Review zone details and manage each zone.</p>
        </div>
        <span id="zoneListStatus" class="flex-none rounded-full bg-[#eef2f6] px-2.5 py-1 text-[11px] font-semibold text-[#475467]" aria-live="polite">0 zones</span>
      </div>
      <div class="space-y-2 rounded-lg border border-[#dfe3e8] bg-[#fafbfc] p-2.5">
        <div class="relative">
          <i class="fas fa-search pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-xs text-[#98a2b3]" aria-hidden="true"></i>
          <input id="zoneSearchInput" type="search" class="w-full rounded-md border border-[#cfd4dc] bg-white py-2 pr-3 pl-9 text-xs text-[#344054] outline-none placeholder:text-[#98a2b3] focus:border-[#84adff] focus:ring-2 focus:ring-[#2e90fa]/20 disabled:cursor-not-allowed disabled:bg-[#f2f4f7]" placeholder="Search zones by name" aria-label="Search zones by name">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <select id="zoneSortSelect" class="cursor-pointer rounded-md border border-[#cfd4dc] bg-white px-2.5 py-2 text-xs font-medium text-[#475467] outline-none focus:border-[#84adff] focus:ring-2 focus:ring-[#2e90fa]/20 disabled:cursor-not-allowed disabled:bg-[#f2f4f7]" aria-label="Sort zones by">
            <option value="name">Sort: Name</option>
            <option value="hexagons">Sort: Hexagons</option>
            <option value="area">Sort: Area</option>
          </select>
          <select id="zoneSortDirectionSelect" class="cursor-pointer rounded-md border border-[#cfd4dc] bg-white px-2.5 py-2 text-xs font-medium text-[#475467] outline-none focus:border-[#84adff] focus:ring-2 focus:ring-[#2e90fa]/20 disabled:cursor-not-allowed disabled:bg-[#f2f4f7]" aria-label="Zone sort direction">
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>
        </div>
      </div>
      <div id="zonesContainer" class="space-y-3 rounded-lg bg-[#f4f6f8] p-2"></div>
      <div id="zonesSummary" class="hidden rounded-lg border border-[#dfe3e8] bg-[#f8fafc] px-3 py-2.5 text-[#475467]" aria-live="polite"></div>
    </section>
  </aside>

  <!-- ------------------- Your app as a browser ES module ------------------- -->
  <script type="module">
    // Use ESM versions from a CDN. We pin Leaflet for the Draw plugin with ?deps=.
    import * as L from "https://esm.sh/leaflet@1.9.4";
    import "https://esm.sh/leaflet-draw@1.0.4?deps=leaflet@1.9.4";
    import * as h3 from "https://esm.sh/h3-js@4.1.0";

    /*************************************************
     * Globals & helpers
     *************************************************/
    const DEFAULT_RESOLUTION = 8;
    const MAP_CENTER = [32.85, 13.1913];
    const HEX_COLOR_REGEX = /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/;

    let h3Resolution = DEFAULT_RESOLUTION;

    const map = L.map("map").setView(MAP_CENTER, 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors",
    }).addTo(map);

    // Layers
    const cellsLayer = L.layerGroup().addTo(map);
    const zoneOutlinesLayer = L.layerGroup().addTo(map);

    // Data stores
    let drawnCells = new Set();
    let cellPolygons = {};
    let selectedCells = new Set();

    let zones = [];
    let hexToZone = {};
    let editingZoneId = null;
    let zoneCounter = 0;

    // -------- Utility --------
    const fmtInt = (v) => v.toLocaleString(undefined, { maximumFractionDigits: 0 });
    const ZONE_ACTION_BUTTON_CLASSES = "inline-flex min-h-9 cursor-pointer items-center justify-center gap-2 rounded-md border px-3 py-2 text-xs font-semibold leading-none transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-[#007bff]/30 disabled:cursor-not-allowed disabled:opacity-50";
    const computeArea = (hexSet) => {
      let total = 0;
      hexSet.forEach((h) => (total += h3.cellArea(h, "m2")));
      return total;
    };
    const isValidHexColor = (c) => HEX_COLOR_REGEX.test(c);

    /*************************************************
     * DOM refs
     *************************************************/
    const drawButton = document.getElementById("drawButton");
    const clearButton = document.getElementById("clearButton");
    const createZoneButton = document.getElementById("createZoneButton");
    const finishEditButton = document.getElementById("finishEditButton");
    const copyIdsButton = document.getElementById("copyIdsButton");
    const copyGeoButton = document.getElementById("copyGeoButton");
    const resolutionSelect = document.getElementById("resolutionSelect");
    const hexagonCounter = document.getElementById("hexagonCounter");
    const zonesContainer = document.getElementById("zonesContainer");
    const exportGeoButton = document.getElementById("exportGeoButton");
    const importGeoButton = document.getElementById("importGeoButton");
    const geojsonFileInput = document.getElementById("geojsonFile");
    const zonesSummaryEl = document.getElementById("zonesSummary");
    const zoneSearchInput = document.getElementById("zoneSearchInput");
    const zoneSortSelect = document.getElementById("zoneSortSelect");
    const zoneSortDirectionSelect = document.getElementById("zoneSortDirectionSelect");
    const zoneListStatus = document.getElementById("zoneListStatus");

    // Populate resolution dropdown
    for (let r = 0; r <= 15; r++) {
      const opt = document.createElement("option");
      opt.value = r.toString();
      opt.textContent = `Resolution ${r}`;
      if (r === DEFAULT_RESOLUTION) opt.selected = true;
      resolutionSelect.appendChild(opt);
    }

    /*************************************************
     * Utility UI functions
     *************************************************/
    function updateHexagonCounter() {
      hexagonCounter.textContent = `Selected Hexagons: ${selectedCells.size}`;
      clearButton.disabled = selectedCells.size === 0;
      createZoneButton.disabled = selectedCells.size === 0;
    }

    function updateCopyButtons() {
      const disabled = zones.length === 0;
      copyIdsButton.disabled = disabled;
      copyGeoButton.disabled = disabled;
      exportGeoButton.disabled = disabled;
    }

    function updateZonesSummary() {
      if (zones.length === 0) {
        zonesSummaryEl.innerHTML = "";
        zonesSummaryEl.classList.add("hidden");
        return;
      }
      let totalHexagons = 0;
      let totalArea = 0;
      zones.forEach(zone => {
        totalHexagons += zone.hexagons.size;
        totalArea += zone.area;
      });
      zonesSummaryEl.innerHTML = `
        <p class="mb-2 text-xs font-semibold text-[#344054]">Zone summary</p>
        <div class="grid grid-cols-3 divide-x divide-[#dfe3e8]">
          <div class="pr-2">
            <span class="block text-[10px] font-semibold uppercase tracking-wide text-[#667085]">Zones</span>
            <strong class="mt-0.5 block text-sm font-semibold text-[#1f2937]">${fmtInt(zones.length)}</strong>
          </div>
          <div class="px-2">
            <span class="block text-[10px] font-semibold uppercase tracking-wide text-[#667085]">Hexagons</span>
            <strong class="mt-0.5 block text-sm font-semibold text-[#1f2937]">${fmtInt(totalHexagons)}</strong>
          </div>
          <div class="pl-2">
            <span class="block text-[10px] font-semibold uppercase tracking-wide text-[#667085]">Area</span>
            <strong class="mt-0.5 block text-sm font-semibold text-[#1f2937]">${fmtInt(totalArea)} m²</strong>
          </div>
        </div>
      `;
      zonesSummaryEl.classList.remove("hidden");
    }

    function getVisibleZones() {
      const query = zoneSearchInput.value.trim().toLocaleLowerCase();
      const sortKey = zoneSortSelect.value;
      const direction = zoneSortDirectionSelect.value === "desc" ? -1 : 1;

      return zones
        .filter((zone) => zone.name.toLocaleLowerCase().includes(query))
        .sort((a, b) => {
          let comparison;
          if (sortKey === "hexagons") {
            comparison = a.hexagons.size - b.hexagons.size;
          } else if (sortKey === "area") {
            comparison = a.area - b.area;
          } else {
            comparison = a.name.localeCompare(b.name, undefined, { sensitivity: "base", numeric: true });
          }

          if (comparison === 0 && sortKey !== "name") {
            comparison = a.name.localeCompare(b.name, undefined, { sensitivity: "base", numeric: true });
          }
          return comparison * direction;
        });
    }

    function renderZonesList() {
      zonesContainer.innerHTML = "";
      const hasZones = zones.length > 0;
      zoneSearchInput.disabled = !hasZones;
      zoneSortSelect.disabled = !hasZones;
      zoneSortDirectionSelect.disabled = !hasZones;

      if (zones.length === 0) {
        zoneSearchInput.value = "";
        zoneListStatus.textContent = "0 zones";
        zonesContainer.innerHTML = `
          <div class="flex h-full min-h-40 flex-col items-center justify-center rounded-md border border-dashed border-[#cbd2da] bg-white px-6 text-center">
            <i class="fas fa-layer-group mb-3 text-2xl text-[#98a2b3]" aria-hidden="true"></i>
            <p class="text-sm font-semibold text-[#344054]">No zones yet</p>
            <p class="mt-1 max-w-72 text-xs leading-5 text-[#667085]">Select hexagons on the map, then choose Create Zone.</p>
          </div>
        `;
      }

      const visibleZones = getVisibleZones();
      const isFiltered = zoneSearchInput.value.trim() !== "";
      zoneListStatus.textContent = isFiltered
        ? `${visibleZones.length} of ${zones.length} zones`
        : `${zones.length} ${zones.length === 1 ? "zone" : "zones"}`;

      if (hasZones && visibleZones.length === 0) {
        zonesContainer.innerHTML = `
          <div class="flex h-full min-h-40 flex-col items-center justify-center rounded-md border border-dashed border-[#cbd2da] bg-white px-6 text-center">
            <i class="fas fa-search mb-3 text-2xl text-[#98a2b3]" aria-hidden="true"></i>
            <p class="text-sm font-semibold text-[#344054]">No matching zones</p>
            <p class="mt-1 max-w-72 text-xs leading-5 text-[#667085]">Try a different zone name.</p>
          </div>
        `;
      }

      visibleZones.forEach((z) => {
        const item = document.createElement("div");
        item.className = `overflow-hidden rounded-lg border bg-white shadow-sm ${editingZoneId === z.id ? "border-[#d4a106] ring-2 ring-[#ffc107]/20" : "border-[#dfe3e8]"}`;

        const left = document.createElement("div");
        left.className = "flex items-start gap-3 px-4 py-3.5";

        const swatch = document.createElement("button");
        swatch.type = "button";
        swatch.className = "mt-0.5 size-7 flex-none cursor-pointer rounded-md border-2 border-white bg-(--zone-color) shadow-[0_0_0_1px_#98a2b3] focus:outline-none focus:ring-2 focus:ring-[#007bff]/40";
        swatch.style.setProperty("--zone-color", z.color);
        swatch.title = `Change color for ${z.name}`;
        swatch.setAttribute("aria-label", `Change color for ${z.name}`);
        swatch.addEventListener("click", () => changeZoneColor(z.id));

        const nameWrap = document.createElement("div");
        nameWrap.className = "min-w-0 flex-1";
        const nameSpan = document.createElement("h3");
        nameSpan.textContent = z.name;
        nameSpan.title = z.name;
        nameSpan.className = "break-words text-base font-semibold leading-5 text-[#1f2937]";

        const metaSpan = document.createElement("div");
        metaSpan.className = "mt-2 flex items-center gap-2 text-xs text-[#475467]";
        metaSpan.innerHTML = `
          <span class="inline-flex items-center gap-1.5 rounded-full bg-[#eef2f6] px-2.5 py-1">
            <i class="fas fa-draw-polygon text-[10px] text-[#667085]" aria-hidden="true"></i>
            ${fmtInt(z.hexagons.size)} hexagons
          </span>
          <span class="inline-flex items-center gap-1.5 rounded-full bg-[#eef2f6] px-2.5 py-1">
            <i class="fas fa-ruler-combined text-[10px] text-[#667085]" aria-hidden="true"></i>
            ${fmtInt(z.area)} m²
          </span>
        `;

        nameWrap.appendChild(nameSpan);
        nameWrap.appendChild(metaSpan);

        left.appendChild(swatch);
        left.appendChild(nameWrap);

        const actions = document.createElement("div");
        actions.className = "grid grid-cols-3 gap-2 border-t border-[#e8ebef] bg-[#fafbfc] p-2.5";

        // Edit button
        const editBtn = document.createElement("button");
        if (editingZoneId === z.id) {
          editBtn.className = `${ZONE_ACTION_BUTTON_CLASSES} border-[#d4a106] bg-[#ffc107] text-[#332701] enabled:hover:bg-[#e0a800]`;
          editBtn.innerHTML = '<i class="fas fa-pencil-alt" aria-hidden="true"></i> Editing';
        } else {
          editBtn.className = `${ZONE_ACTION_BUTTON_CLASSES} border-[#a5dce4] bg-[#edf9fb] text-[#0b7180] enabled:hover:bg-[#d9f3f7]`;
          editBtn.innerHTML = '<i class="fas fa-pencil-alt" aria-hidden="true"></i> Edit';
          editBtn.title = "Edit Zone";
        }
        editBtn.disabled = editingZoneId !== null && editingZoneId !== z.id;
        editBtn.addEventListener("click", () => toggleEditZone(z.id));

        // Rename button
        const renameBtn = document.createElement("button");
        renameBtn.className = `${ZONE_ACTION_BUTTON_CLASSES} border-[#d0d5dd] bg-white text-[#475467] enabled:hover:bg-[#f2f4f7]`;
        renameBtn.innerHTML = '<i class="fas fa-font" aria-hidden="true"></i> Rename';
        renameBtn.title = "Rename Zone";
        renameBtn.disabled = editingZoneId !== null && editingZoneId !== z.id;
        renameBtn.addEventListener("click", () => renameZone(z.id));

        // Center/locate button
        const locateBtn = document.createElement("button");
        locateBtn.className = `${ZONE_ACTION_BUTTON_CLASSES} border-[#d7c8ef] bg-[#f5f0fc] text-[#6941a5] enabled:hover:bg-[#ebe1f8]`;
        locateBtn.innerHTML = '<i class="fas fa-crosshairs" aria-hidden="true"></i> Locate';
        locateBtn.title = "Center map on zone";
        locateBtn.disabled = editingZoneId !== null && editingZoneId !== z.id;
        locateBtn.addEventListener("click", () => zoomToZone(z.id));

        // Copy this zone's H3 cell IDs
        const copyCellIdsBtn = document.createElement("button");
        copyCellIdsBtn.className = `${ZONE_ACTION_BUTTON_CLASSES} border-[#b8d7fb] bg-[#eff6ff] text-[#175cd3] enabled:hover:bg-[#dbeafe]`;
        copyCellIdsBtn.innerHTML = '<i class="fas fa-hashtag" aria-hidden="true"></i> Cell IDs';
        copyCellIdsBtn.title = "Copy zone cell IDs";
        copyCellIdsBtn.setAttribute("aria-label", `Copy cell IDs for ${z.name}`);
        copyCellIdsBtn.addEventListener("click", () => copyZoneCellIds(z.id));

        // Copy this zone as a GeoJSON Feature
        const copyGeoJSONBtn = document.createElement("button");
        copyGeoJSONBtn.className = `${ZONE_ACTION_BUTTON_CLASSES} border-[#b7dfc2] bg-[#effaf2] text-[#19733a] enabled:hover:bg-[#dcf4e3]`;
        copyGeoJSONBtn.innerHTML = '<i class="fas fa-copy" aria-hidden="true"></i> GeoJSON';
        copyGeoJSONBtn.title = "Copy zone GeoJSON";
        copyGeoJSONBtn.setAttribute("aria-label", `Copy GeoJSON for ${z.name}`);
        copyGeoJSONBtn.addEventListener("click", () => copyZoneGeoJSON(z.id));

        // Delete button
        const deleteBtn = document.createElement("button");
        deleteBtn.className = `${ZONE_ACTION_BUTTON_CLASSES} border-[#f2b8bd] bg-[#fff1f2] text-[#b4232f] enabled:hover:bg-[#ffe1e4]`;
        deleteBtn.innerHTML = '<i class="fas fa-trash-alt" aria-hidden="true"></i> Delete';
        deleteBtn.title = "Delete Zone";
        deleteBtn.disabled = editingZoneId !== null;
        deleteBtn.addEventListener("click", () => deleteZone(z.id));

        actions.appendChild(editBtn);
        actions.appendChild(renameBtn);
        actions.appendChild(locateBtn);
        actions.appendChild(copyCellIdsBtn);
        actions.appendChild(copyGeoJSONBtn);
        actions.appendChild(deleteBtn);

        item.appendChild(left);
        item.appendChild(actions);
        zonesContainer.appendChild(item);
      });
      updateCopyButtons();
      updateZonesSummary();
    }

    zoneSearchInput.addEventListener("input", renderZonesList);
    zoneSortSelect.addEventListener("change", renderZonesList);
    zoneSortDirectionSelect.addEventListener("change", renderZonesList);

    /*************************************************
     * Grid drawing
     *************************************************/
    function drawH3Cells() {
      const bounds = map.getBounds();
      const nw = bounds.getNorthWest();
      const se = bounds.getSouthEast();

      const hexagonsToDraw = h3.polygonToCells(
        [
          [nw.lat, nw.lng],
          [se.lat, nw.lng],
          [se.lat, se.lng],
          [nw.lat, se.lng],
        ],
        h3Resolution,
        false
      );

      hexagonsToDraw.forEach((hex) => {
        if (drawnCells.has(hex)) return;

        const coords = h3.cellToBoundary(hex).map(([lat, lng]) => [lat, lng]);
        const polygon = L.polygon(coords, { color: "blue", weight: 1, fillOpacity: 0 });
        polygon.h3Index = hex;

        if (hexToZone[hex] !== undefined) {
          const zone = zones.find((z) => z.id === hexToZone[hex]);
          if (zone) {
            applyZoneStyle(polygon, zone);
            polygon.inZone = true;
          }
        }

        polygon.on("mouseover", function () {
          if (this.inZone || editingZoneId !== null) return;
          if (!selectedCells.has(this.h3Index)) this.setStyle({ fillOpacity: 0.25 });
        });
        polygon.on("mouseout", function () {
          if (this.inZone || editingZoneId !== null) return;
          if (!selectedCells.has(this.h3Index)) this.setStyle({ fillOpacity: 0 });
        });
        polygon.on("click", function () {
          const hex = this.h3Index;
          if (editingZoneId !== null) { handleEditingClick(hex, this); return; }
          if (hexToZone[hex] !== undefined) {
            alert(`Hexagon already in zone "${zones.find((z) => z.id === hexToZone[hex]).name}"`);
            return;
          }
          toggleSelection(hex, this);
        });

        cellPolygons[hex] = polygon;
        cellsLayer.addLayer(polygon);
        drawnCells.add(hex);
      });
    }

    map.on("moveend", drawH3Cells);
    drawH3Cells();

    /*************************************************
     * Selection helpers
     *************************************************/
    function toggleSelection(hex, polygon) {
      if (selectedCells.has(hex)) {
        selectedCells.delete(hex);
        polygon.setStyle({ fillOpacity: 0 });
      } else {
        selectedCells.add(hex);
        polygon.setStyle({ fillOpacity: 0.5 });
      }
      updateHexagonCounter();
    }

    function selectHex(hex) {
      if (selectedCells.has(hex)) return;
      const polygon = cellPolygons[hex];
      if (!polygon) return;
      selectedCells.add(hex);
      polygon.setStyle({ fillOpacity: 0.5 });
      updateHexagonCounter();
    }

    /*************************************************
     * Leaflet‑draw selection polygon
     *************************************************/
    const drawControl = new L.Control.Draw({
      draw: { polygon: true, polyline: false, rectangle: false, circle: false, marker: false, circlemarker: false }
    });
    let isDrawing = false;

    function setDrawButtonState(drawing) {
      drawButton.innerHTML = drawing
        ? '<i class="fas fa-times" aria-hidden="true"></i> Cancel drawing'
        : '<i class="fas fa-draw-polygon" aria-hidden="true"></i> Draw polygon';
    }

    drawButton.addEventListener("click", () => {
      if (isDrawing) {
        map.removeControl(drawControl);
        setDrawButtonState(false);
        isDrawing = false;
      } else {
        if (editingZoneId !== null) return;
        map.addControl(drawControl);
        setDrawButtonState(true);
        isDrawing = true;
      }
    });

    map.on("draw:created", (e) => {
      const layer = e.layer;
      const poly = layer.toGeoJSON().geometry.coordinates[0].map(([lng, lat]) => [lat, lng]);
      const hexagons = h3.polygonToCells(poly, h3Resolution, false);
      hexagons.forEach((h) => { if (hexToZone[h] === undefined) selectHex(h); });
      map.removeControl(drawControl);
      setDrawButtonState(false);
      isDrawing = false;
    });

    /*************************************************
     * Zone functions
     *************************************************/
    createZoneButton.addEventListener("click", () => {
      if (selectedCells.size === 0) return;

      let name;
      while (true) {
        name = prompt("Zone name:");
        if (name === null) return;
        name = name.trim();
        if (name === "") { alert("Zone name cannot be empty. Please enter a name."); continue; }
        if (zones.some((z) => z.name.toLowerCase() === name.toLowerCase())) { alert("Zone name must be unique. Please try a different name."); continue; }
        break;
      }

      let color;
      while (true) {
        color = prompt("Zone color (#RRGGBB or #RGB):", "#ff0000");
        if (color === null) return;
        if (!isValidHexColor(color)) { alert("Color must be a valid hex code starting with # (e.g., #ff0000 or #f00)."); continue; }
        if (zones.some((z) => z.color.toLowerCase() === color.toLowerCase())) { alert("Zone color must be unique. Please choose a different color."); continue; }
        break;
      }

      const overlap = Array.from(selectedCells).filter((h) => hexToZone[h] !== undefined);
      if (overlap.length) { alert("Some selected hexagons are already assigned to zones."); return; }

      const area = computeArea(selectedCells);
      const zone = { id: zoneCounter++, name, color, hexagons: new Set(selectedCells), area, outlinePolys: [] };

      zones.push(zone);
      zone.hexagons.forEach((hex) => {
        hexToZone[hex] = zone.id;
        const poly = cellPolygons[hex];
        if (poly) { applyZoneStyle(poly, zone); poly.inZone = true; }
      });
      drawZoneOutline(zone);

      selectedCells.clear();
      updateHexagonCounter();
      renderZonesList();
    });

    clearButton.addEventListener("click", () => {
      selectedCells.forEach((hex) => { const poly = cellPolygons[hex]; if (poly) poly.setStyle({ fillOpacity: 0 }); });
      selectedCells.clear();
      updateHexagonCounter();
    });

    function applyZoneStyle(polygon, zone) {
      polygon.setStyle({ fillOpacity: 0.5, fillColor: zone.color, weight: 0 });
    }

    function drawZoneOutline(zone) {
      if (zone.outlinePolys?.length) zone.outlinePolys.forEach((p) => zoneOutlinesLayer.removeLayer(p));
      zone.outlinePolys = [];
      const multiLngLat = h3.cellsToMultiPolygon(Array.from(zone.hexagons), true);
      multiLngLat.forEach((polyLngLat) => {
        const latlngs = polyLngLat.map((ringLngLat) => ringLngLat.map(([lng, lat]) => [lat, lng]));
        const outline = L.polygon(latlngs, { color: zone.color, weight: 3, fillOpacity: 0, interactive: false });
        zoneOutlinesLayer.addLayer(outline);
        zone.outlinePolys.push(outline);
      });
    }

    function changeZoneColor(zoneId) {
      const zone = zones.find((z) => z.id === zoneId);
      if (!zone) return;

      let newColor;
      while (true) {
        newColor = prompt("New color (#RRGGBB or #RGB):", zone.color);
        if (newColor === null) return;
        if (newColor.toLowerCase() === zone.color.toLowerCase()) return;
        if (!isValidHexColor(newColor)) { alert("Color must be a valid hex code starting with # (e.g., #ff0000 or #f00)."); continue; }
        if (zones.some((z_other) => z_other.id !== zoneId && z_other.color.toLowerCase() === newColor.toLowerCase())) { alert("This color is already used by another zone. Please choose a unique color."); continue; }
        break;
      }

      zone.color = newColor;
      zone.hexagons.forEach((hex) => { const poly = cellPolygons[hex]; if (poly) applyZoneStyle(poly, zone); });
      drawZoneOutline(zone);
      renderZonesList();
    }

    // Fit map to a zone's full extent (N/S/E/W extremes)
    function zoomToZone(zoneId) {
      const zone = zones.find((z) => z.id === zoneId);
      if (!zone) return;

      // Ensure outlines exist for bounds calculation
      if (!zone.outlinePolys || zone.outlinePolys.length === 0) {
        drawZoneOutline(zone);
      }

      let combinedBounds = null;
      if (zone.outlinePolys && zone.outlinePolys.length) {
        zone.outlinePolys.forEach((poly) => {
          const b = poly.getBounds();
          if (!combinedBounds) {
            combinedBounds = L.latLngBounds(b.getSouthWest(), b.getNorthEast());
          } else {
            combinedBounds.extend(b);
          }
        });
      } else {
        // Fallback: compute bounds from cell boundaries
        const latlngs = [];
        zone.hexagons.forEach((hex) => {
          const boundary = h3.cellToBoundary(hex);
          boundary.forEach(([lat, lng]) => latlngs.push([lat, lng]));
        });
        if (latlngs.length) {
          combinedBounds = L.latLngBounds(latlngs.map(([lat, lng]) => L.latLng(lat, lng)));
        }
      }

      if (combinedBounds) {
        map.fitBounds(combinedBounds, { padding: [40, 40] });
      }
    }

    function toggleEditZone(zoneId) {
      if (editingZoneId === zoneId) { finishEditing(); return; }
      if (editingZoneId !== null) return;
      editingZoneId = zoneId;
      drawButton.disabled = true;
      resolutionSelect.disabled = true;
      createZoneButton.disabled = true;
      importGeoButton.disabled = true;
      finishEditButton.classList.remove("hidden");
      finishEditButton.classList.add("flex");
      renderZonesList();
    }

    finishEditButton.addEventListener("click", finishEditing);
    function finishEditing() {
      editingZoneId = null;
      drawButton.disabled = false;
      resolutionSelect.disabled = false;
      createZoneButton.disabled = selectedCells.size === 0;
      importGeoButton.disabled = false;
      finishEditButton.classList.remove("flex");
      finishEditButton.classList.add("hidden");
      renderZonesList();
    }

    function handleEditingClick(hex, polygon) {
      const zone = zones.find((z) => z.id === editingZoneId);
      if (!zone) return;

      const hexArea = h3.cellArea(hex, "m2");

      if (zone.hexagons.has(hex)) {
        zone.hexagons.delete(hex);
        zone.area -= hexArea;
        delete hexToZone[hex];
        polygon.inZone = false;
        polygon.setStyle({ fillOpacity: 0, color: "blue", weight: 1 });
      } else {
        if (hexToZone[hex] !== undefined) { alert("Hexagon already belongs to another zone."); return; }
        zone.hexagons.add(hex);
        zone.area += hexArea;
        hexToZone[hex] = zone.id;
        polygon.inZone = true;
        applyZoneStyle(polygon, zone);
      }
      drawZoneOutline(zone);
      renderZonesList();
    }

    function deleteZone(zoneId) {
      const idx = zones.findIndex((z) => z.id === zoneId);
      if (idx === -1) return;
      const zone = zones[idx];
      if (!confirm(`Delete zone "${zone.name}"? This cannot be undone.`)) return;
      if (editingZoneId !== null) { alert("Finish editing before deleting a zone."); return; }

      zone.outlinePolys?.forEach((p) => zoneOutlinesLayer.removeLayer(p));
      zone.hexagons.forEach((hex) => {
        delete hexToZone[hex];
        const poly = cellPolygons[hex];
        if (poly) { poly.inZone = false; poly.setStyle({ fillOpacity: 0, color: "blue", weight: 1 }); }
      });

      zones.splice(idx, 1);
      renderZonesList();
    }

    /*************************************************
     * Copy & Export buttons
     *************************************************/
    function getGeoJSONFeatureForZone(zone) {
      const multiLngLat = h3.cellsToMultiPolygon(Array.from(zone.hexagons), true);
      return {
        type: "Feature",
        geometry: { type: "MultiPolygon", coordinates: multiLngLat },
        properties: {
          zone_name: zone.name,
          zone_color: zone.color,
          hex_count: zone.hexagons.size,
          area_m2: Math.round(zone.area),
          h3_resolution: h3Resolution,
        },
      };
    }

    function getGeoJSONForAllZones() {
      const features = zones.map(getGeoJSONFeatureForZone);
      return { type: "FeatureCollection", features };
    }

    function getCellIdsForZone(zone) {
      return {
        zone_name: zone.name,
        zone_color: zone.color,
        hex_count: zone.hexagons.size,
        area_m2: Math.round(zone.area),
        zone_cells: Array.from(zone.hexagons),
      };
    }

    function copyZoneCellIds(zoneId) {
      const zone = zones.find((z) => z.id === zoneId);
      if (!zone) return;

      navigator.clipboard.writeText(JSON.stringify(getCellIdsForZone(zone), null, 2))
        .then(() => alert(`Cell IDs for zone "${zone.name}" copied!`));
    }

    function copyZoneGeoJSON(zoneId) {
      const zone = zones.find((z) => z.id === zoneId);
      if (!zone) return;

      const feature = getGeoJSONFeatureForZone(zone);
      navigator.clipboard.writeText(JSON.stringify(feature, null, 2))
        .then(() => alert(`GeoJSON for zone "${zone.name}" copied!`));
    }

    copyIdsButton.addEventListener("click", () => {
      const payload = zones.map(getCellIdsForZone);
      navigator.clipboard.writeText(JSON.stringify(payload, null, 2))
        .then(() => alert("Zone cell IDs copied!"));
    });

    copyGeoButton.addEventListener("click", () => {
      const geojson = getGeoJSONForAllZones();
      navigator.clipboard.writeText(JSON.stringify(geojson, null, 2))
        .then(() => alert("GeoJSON copied!"));
    });

    exportGeoButton.addEventListener("click", () => {
      if (zones.length === 0) return;
      const geojson = getGeoJSONForAllZones();
      const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "zones.geojson";
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    });

    /*************************************************
     * Import GeoJSON
     *************************************************/
    let genericZoneNameCounter = 1;
    const defaultColors = ["#E6194B", "#3CB44B", "#FFE119", "#4363D8", "#F58231", "#911EB4", "#46F0F0", "#F032E6", "#BCF60C", "#FABEBE", "#008080", "#E6BEFF", "#9A6324", "#FFFAC8", "#800000", "#AAFFC3", "#808000", "#FFD8B1", "#000075", "#808080"];
    let defaultColorIndex = 0;

    function generateUniqueZoneName(currentGlobalZones, tempNewZonesList) {
      let name;
      do {
        name = `Zone ${genericZoneNameCounter++}`;
      } while (currentGlobalZones.some(z => z.name.toLowerCase() === name.toLowerCase()) ||
        tempNewZonesList.some(nz => nz.name.toLowerCase() === name.toLowerCase()));
      return name;
    }

    function generateUniqueZoneColor(currentGlobalZones, tempNewZonesList) {
      let color; let attempts = 0;
      const initialIndex = defaultColorIndex;
      do {
        color = defaultColors[defaultColorIndex % defaultColors.length];
        defaultColorIndex++; attempts++;
        if (attempts > defaultColors.length && defaultColorIndex % defaultColors.length === initialIndex % defaultColors.length) break;
      } while ((currentGlobalZones.some(z => z.color.toLowerCase() === color.toLowerCase()) ||
        tempNewZonesList.some(nz => nz.color.toLowerCase() === color.toLowerCase())) && attempts < defaultColors.length * 2);

      if (currentGlobalZones.some(z => z.color.toLowerCase() === color.toLowerCase()) ||
        tempNewZonesList.some(nz => nz.color.toLowerCase() === color.toLowerCase())) {
        do { color = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'); }
        while (currentGlobalZones.some(z => z.color.toLowerCase() === color.toLowerCase()) ||
          tempNewZonesList.some(nz => nz.color.toLowerCase() === color.toLowerCase()));
      }
      return color;
    }

    importGeoButton.addEventListener("click", () => {
      if (editingZoneId !== null) { alert("Please finish editing the current zone before importing."); return; }
      geojsonFileInput.click();
    });

    geojsonFileInput.addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const geojsonData = JSON.parse(e.target.result);
          if (geojsonData.type !== "FeatureCollection" || !Array.isArray(geojsonData.features)) throw new Error("Invalid GeoJSON: Must be a FeatureCollection with a 'features' array.");
          if (geojsonData.features.length === 0) { alert("No features found in the GeoJSON file."); event.target.value = null; return; }

          const importResolution = geojsonData.features[0]?.properties?.h3_resolution;
          if (importResolution !== undefined && importResolution !== h3Resolution) {
            if (!confirm(`The imported GeoJSON was created with H3 resolution ${importResolution}, but your current resolution is ${h3Resolution}. Cells will be generated using resolution ${h3Resolution}. This may lead to different results. Continue?`)) {
              event.target.value = null; return;
            }
          }

          if (zones.length > 0) {
            if (!confirm("Importing new GeoJSON will clear all existing zones. Continue?")) { event.target.value = null; return; }
            clearAllZones();
            if (selectedCells.size) clearButton.click();
          } else {
            genericZoneNameCounter = 1; defaultColorIndex = 0;
          }

          const importedZonesBatch = [];
          let importedCellCount = 0;

          for (const feature of geojsonData.features) {
            if (feature.type !== "Feature" || !feature.geometry || feature.geometry.type !== "MultiPolygon") { console.warn("Skipping invalid feature:", feature); continue; }

            let zoneName = feature.properties?.zone_name;
            let zoneColor = feature.properties?.zone_color;

            if (!zoneName || String(zoneName).trim() === "") {
              zoneName = generateUniqueZoneName(zones, importedZonesBatch);
            } else {
              zoneName = String(zoneName).trim();
              if (zones.some(z => z.name.toLowerCase() === zoneName.toLowerCase()) ||
                importedZonesBatch.some(nz => nz.name.toLowerCase() === zoneName.toLowerCase())) {
                console.warn(`Zone name "${zoneName}" from file already exists or is duplicated. Assigning a generic name.`);
                zoneName = generateUniqueZoneName(zones, importedZonesBatch);
              }
            }

            if (!zoneColor || !isValidHexColor(zoneColor)) {
              if (zoneColor) console.warn(`Invalid color "${zoneColor}" for zone "${zoneName}". Assigning default.`);
              zoneColor = generateUniqueZoneColor(zones, importedZonesBatch);
            } else {
              if (zones.some(z => z.color.toLowerCase() === zoneColor.toLowerCase()) ||
                importedZonesBatch.some(nz => nz.color.toLowerCase() === zoneColor.toLowerCase())) {
                console.warn(`Zone color "${zoneColor}" for zone "${zoneName}" already exists or is duplicated. Assigning new default.`);
                zoneColor = generateUniqueZoneColor(zones, importedZonesBatch);
              }
            }

            const zoneH3Cells = new Set();
            for (const polygonGeoJsonCoords of feature.geometry.coordinates) {
              if (polygonGeoJsonCoords && polygonGeoJsonCoords.length > 0 && polygonGeoJsonCoords[0].length >= 3) {
                try {
                  const cellsFromPolygon = h3.polygonToCells(polygonGeoJsonCoords, h3Resolution, true);
                  cellsFromPolygon.forEach(cell => {
                    if (hexToZone[cell] !== undefined) {
                      const existingGlobalZone = zones.find(z => z.id === hexToZone[cell]);
                      console.warn(`Hex ${cell} for "${zoneName}" already in existing zone "${existingGlobalZone?.name}". Skipping cell.`);
                    } else {
                      let cellInBatch = false;
                      for (const bz of importedZonesBatch) {
                        if (bz.hexagons.has(cell)) {
                          console.warn(`Hex ${cell} for "${zoneName}" already in another new zone "${bz.name}" from this import. Skipping cell.`);
                          cellInBatch = true; break;
                        }
                      }
                      if (!cellInBatch) zoneH3Cells.add(cell);
                    }
                  });
                } catch (h3Error) {
                  console.error(`Error converting polygon to H3 cells for zone "${zoneName}":`, h3Error, "Polygon data:", polygonGeoJsonCoords);
                }
              } else {
                console.warn(`Skipping malformed polygon within MultiPolygon for zone "${zoneName}".`);
              }
            }

            if (zoneH3Cells.size > 0) {
              importedZonesBatch.push({ id: -1, name: zoneName, color: zoneColor, hexagons: zoneH3Cells, area: computeArea(zoneH3Cells), outlinePolys: [] });
              importedCellCount += zoneH3Cells.size;
            } else {
              console.warn(`No valid, non-overlapping H3 cells generated for zone "${zoneName}". It might be too small, outside map, or entirely overlapping.`);
            }
          }

          importedZonesBatch.forEach(newZoneData => {
            newZoneData.id = zoneCounter++;
            zones.push(newZoneData);
            newZoneData.hexagons.forEach(hex => { hexToZone[hex] = newZoneData.id; });
          });

          if (importedZonesBatch.length > 0) {
            redrawGrid();
            renderZonesList();
            alert(`Successfully imported ${importedZonesBatch.length} zone(s) with a total of ${importedCellCount} unique cells.`);
          } else {
            alert("Import complete, but no new zones were added. Check console for details if features were expected.");
          }

        } catch (error) {
          console.error("Error importing GeoJSON:", error);
          alert(`Error importing GeoJSON: ${error.message}`);
        } finally {
          event.target.value = null;
        }
      };
      reader.onerror = () => { alert("Error reading file."); event.target.value = null; };
      reader.readAsText(file);
    });

    /*************************************************
     * Resolution change & redraw helpers
     *************************************************/
    resolutionSelect.addEventListener("change", function () {
      if (zones.length && !confirm("Changing resolution will remove all zones and selections. Continue?")) {
        this.value = h3Resolution; return;
      }
      clearAllZones();
      if (selectedCells.size) clearButton.click();
      h3Resolution = parseInt(this.value);
      redrawGrid();
    });

    function clearAllZones() {
      if (editingZoneId !== null) finishEditing();
      zones.forEach((z) => { z.outlinePolys?.forEach((p) => zoneOutlinesLayer.removeLayer(p)); });
      zones = []; hexToZone = {};
      renderZonesList();
      updateCopyButtons();
      genericZoneNameCounter = 1;
      defaultColorIndex = 0;
    }

    function redrawGrid() {
      cellsLayer.clearLayers();
      zoneOutlinesLayer.clearLayers();
      drawnCells.clear();
      cellPolygons = {};
      drawH3Cells();
      zones.forEach(drawZoneOutline);
    }

    /*************************************************
     * Rename zone
     *************************************************/
    function renameZone(zoneId) {
      const zone = zones.find(z => z.id === zoneId);
      if (!zone) return;
      let newName;
      while (true) {
        newName = prompt("New zone name:", zone.name);
        if (newName === null) return;
        newName = newName.trim();
        if (newName === "") { alert("Name cannot be empty."); continue; }
        if (zones.some(z => z.id !== zoneId && z.name.toLowerCase() === newName.toLowerCase())) { alert("Name must be unique."); continue; }
        break;
      }
      zone.name = newName;
      renderZonesList();
    }

    // Initial UI setup
    updateCopyButtons();
    renderZonesList();
  </script>
</body>

</html>
